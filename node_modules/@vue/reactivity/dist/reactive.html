<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="app">123</div>
    <script type="module">
        import { reactive, effect } from './reactivity.esm.js'
        const state = reactive({
            name:'jw',
            age: 18,
            flag: false,
            n:{n:1}
        })//相同对象代理多次仍然返回同一个对象
        //嵌套也是相同，可以减少new的次数
        //effect副作用函数 默认执行一次 数据变化后再次执行
        const runner = effect(()=>{
            console.log("runner");
            document.getElementById('app').innerHTML = state.name + state.age//执行操作，进行取值
        },{
            scheduler(){//组件更新基于这个方法实现，可以实现一些优化效果
                console.log('scheduler');
            }
        })
        setTimeout(()=>{
            state.age = 20;
            runner();//手动执行
        },1000)
    </script>
</body>
</html>
